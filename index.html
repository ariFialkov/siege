<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1219" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Siege</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden; background: #0d1219;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none;
      color: #eef2f6;
    }
    canvas { display: block; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; }
    #sling { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; }
    #labels { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }

    .hidden { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

    /* ---------- floating bet results ---------- */
    .float-label {
      position: absolute; pointer-events: none; white-space: nowrap;
      font-weight: 800; font-size: clamp(18px, 3.4vw, 30px);
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      transform: translate(-50%, -50%);
    }
    .label-win { color: #6dff8f; }
    .label-lose { color: #ff6d6d; font-size: clamp(14px, 2.6vw, 22px); }
    .label-jackpot {
      color: #ffd24a; font-size: clamp(26px, 5vw, 44px);
      text-shadow: 0 0 18px rgba(255, 210, 74, .8), 0 2px 8px rgba(0,0,0,.6);
    }

    /* ---------- vignette result flash ---------- */
    #vignette { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; }
    #vignette.flash-win  { box-shadow: inset 0 0 18vmin rgba(60, 255, 120, .55); }
    #vignette.flash-lose { box-shadow: inset 0 0 18vmin rgba(255, 60, 60, .45); }
    #vignette.on { animation: vflash .5s ease-out; }
    @keyframes vflash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

    /* ---------- shared chrome ---------- */
    .panel {
      background: rgba(10, 14, 20, .62); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
    }
    .gold { color: #ffd24a; }

    /* ---------- menu ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: max(4vh, env(safe-area-inset-top)) 20px max(5vh, env(safe-area-inset-bottom));
      background: linear-gradient(rgba(5,8,12,.35), transparent 30%, transparent 62%, rgba(5,8,12,.55));
      pointer-events: none;
    }
    #menu > * { pointer-events: auto; }
    #title {
      font-size: clamp(44px, 9vw, 84px); font-weight: 900; letter-spacing: .28em;
      margin-left: .28em; /* optically recenter for tracking */
      text-shadow: 0 4px 24px rgba(0,0,0,.6);
    }
    #title small { display: block; font-size: clamp(11px, 1.8vw, 14px); font-weight: 500; letter-spacing: .5em; color: #ffd24a; margin-top: 2px; }
    #map-select { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
    #map-select .arrow {
      width: 46px; height: 46px; border-radius: 12px; font-size: 20px;
      background: rgba(255,255,255,.07); transition: background .15s;
    }
    #map-select .arrow:active { background: rgba(255,255,255,.2); }
    #map-meta { text-align: center; min-width: 168px; }
    #map-name { font-size: 24px; font-weight: 800; letter-spacing: .06em; }
    #map-blurb { font-size: 12.5px; color: #aab6c2; margin-top: 3px; }
    #menu-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #play-btn {
      padding: 15px 64px; border-radius: 999px; font-size: 19px; font-weight: 800; letter-spacing: .14em;
      color: #17120a; background: linear-gradient(#ffdf7e, #f0b428);
      box-shadow: 0 6px 24px rgba(240, 180, 40, .38); transition: transform .12s;
    }
    #play-btn:active { transform: scale(.96); }
    #menu-balance-wrap { font-size: 14px; color: #aab6c2; padding: 8px 18px; }
    #menu-balance { color: #ffd24a; font-weight: 700; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud-top {
      position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
    }
    #hud-top > * { pointer-events: auto; }
    #balance-wrap { padding: 9px 16px; font-size: 15px; }
    #balance-wrap .cap { font-size: 10.5px; letter-spacing: .18em; color: #aab6c2; display: block; }
    #balance { font-weight: 800; font-size: 19px; }
    #menu-btn { padding: 10px 16px; font-size: 13px; letter-spacing: .1em; color: #dfe6ec; }

    #bet-panel {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    }
    #stake { display: flex; align-items: center; gap: 6px; }
    #stake button { width: 38px; height: 38px; border-radius: 10px; font-size: 19px; background: rgba(255,255,255,.08); }
    #stake button:active { background: rgba(255,255,255,.22); }
    #stake-value { min-width: 44px; text-align: center; font-weight: 800; font-size: 19px; color: #ffd24a; }
    #multipliers { display: flex; gap: 5px; }
    .chip {
      padding: 8px 11px; border-radius: 10px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,.08); color: #cfd8e0;
    }
    .chip.active { background: linear-gradient(#ffdf7e, #f0b428); color: #17120a; }
    #bet-total { font-size: 11px; letter-spacing: .08em; color: #aab6c2; padding-left: 2px; }

    #hint {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      font-size: 13px; letter-spacing: .06em; color: rgba(238,242,246,.75);
      pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6);
      animation: hintpulse 2.4s ease-in-out infinite;
    }
    @keyframes hintpulse { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

    #toast {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
      background: rgba(10,14,20,.85); border: 1px solid rgba(255,255,255,.14);
      opacity: 0; transition: opacity .25s; z-index: 20; pointer-events: none; white-space: nowrap;
    }
    #toast.on { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <canvas id="sling"></canvas>
  <div id="labels"></div>

  <div id="menu">
    <div id="title">SIEGE<small>DEFEND &nbsp;·&nbsp; FIRE &nbsp;·&nbsp; WIN</small></div>
    <div style="flex:1"></div>
    <div id="menu-bottom">
      <div id="map-select" class="panel">
        <button class="arrow" id="map-prev" aria-label="Previous map">‹</button>
        <div id="map-meta">
          <div id="map-name">Fortress</div>
          <div id="map-blurb">Medieval castle · Catapult</div>
        </div>
        <button class="arrow" id="map-next" aria-label="Next map">›</button>
      </div>
      <button id="play-btn">PLAY</button>
      <div id="menu-balance-wrap" class="panel">Balance&ensp;<span id="menu-balance">0</span></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="balance-wrap" class="panel"><span class="cap">BALANCE</span><span id="balance" class="gold">0</span></div>
      <button id="menu-btn" class="panel">MENU</button>
    </div>
    <div id="hint">pull back anywhere &nbsp;·&nbsp; release to fire</div>
    <div id="bet-panel" class="panel">
      <div id="stake">
        <button id="stake-minus" aria-label="Decrease stake">−</button>
        <div>
          <div id="stake-value">10</div>
          <div id="bet-total">bet 10</div>
        </div>
        <button id="stake-plus" aria-label="Increase stake">+</button>
      </div>
      <div id="multipliers"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // Build the import map before any module loads: prefer the vendored copy
    // in lib/ (created by `npm install`), fall back to the CDN otherwise.
    (function () {
      const CDN = 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';
      const local = './lib/three.module.min.js'; // "./" required by import-map spec
      const req = new XMLHttpRequest(); // sync so the map exists before modules parse
      let src = CDN;
      try {
        req.open('HEAD', local, false);
        req.send();
        if (req.status >= 200 && req.status < 300) src = local;
      } catch (_) { /* fall through to CDN */ }
      const im = document.createElement('script');
      im.type = 'importmap';
      im.textContent = JSON.stringify({ imports: { three: src } });
      document.head.appendChild(im);
      const main = document.createElement('script');
      main.type = 'module';
      main.src = 'js/main.js';
      document.head.appendChild(main);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
